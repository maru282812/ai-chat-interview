<title>ミッションのテーマ 15種</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap">
<style>
/* ===============================================================
   ミッションページのテーマ 15種
   -------------------------------------------------------------
   テーマは「コード」ではなく「データ」。ページは1つで、
   ルートに data-theme="<key>" を付けるだけで世界が変わる。
   → 15テーマ作っても保守するページは1枚のまま。

   各テーマが持つのは6値だけ:
     --t-bg / --t-bg2 / --t-ink / --t-sub / --t-accent / --t-edge
   CTA上の文字色 --t-on-accent は明度から決め打ちで持たせる
   （コントラストを実測して選定済み）。
   =============================================================== */

/* 定番（フォレスト） — 通年・既定 */
[data-theme="forest"]{
  --t-bg:#0E6B5A; --t-bg2:#0A5245;
  --t-ink:#FFFFFF; --t-sub:#BFE0D6;
  --t-accent:#FFD836; --t-edge:#C79A00; --t-on-accent:#2B1A00;
}
/* さくら — 3-4月・新生活 */
[data-theme="sakura"]{
  --t-bg:#8E3B5A; --t-bg2:#6E2A44;
  --t-ink:#FFF4F8; --t-sub:#F3C3D6;
  --t-accent:#FFD9E4; --t-edge:#C98BA4; --t-on-accent:#2B1A00;
}
/* 新緑 — 5-6月 */
[data-theme="freshgreen"]{
  --t-bg:#2A6B36; --t-bg2:#1E5228;
  --t-ink:#F4FBF2; --t-sub:#CDECCF;
  --t-accent:#FFE86B; --t-edge:#C0A72E; --t-on-accent:#2B1A00;
}
/* つゆ — 6月・梅雨 */
[data-theme="tsuyu"]{
  --t-bg:#34527A; --t-bg2:#243E5C;
  --t-ink:#F2F7FC; --t-sub:#C6D8EC;
  --t-accent:#8FE3D8; --t-edge:#3E958A; --t-on-accent:#2B1A00;
}
/* なつ — 7-8月 */
[data-theme="summer"]{
  --t-bg:#0E5E8A; --t-bg2:#0A4668;
  --t-ink:#F0FAFF; --t-sub:#B4DCEF;
  --t-accent:#FFD836; --t-edge:#C79A00; --t-on-accent:#2B1A00;
}
/* なつまつり — 8月・お祭り */
[data-theme="festival"]{
  --t-bg:#5B2140; --t-bg2:#40162D;
  --t-ink:#FFF2E8; --t-sub:#E8B49C;
  --t-accent:#FF8A3D; --t-edge:#C25A1C; --t-on-accent:#2B1A00;
}
/* あき — 9-10月 */
[data-theme="autumn"]{
  --t-bg:#7A4318; --t-bg2:#5A3010;
  --t-ink:#FFF6EC; --t-sub:#E2BE96;
  --t-accent:#FFC24D; --t-edge:#C08A1F; --t-on-accent:#2B1A00;
}
/* みのり — 10-11月・収穫 */
[data-theme="harvest"]{
  --t-bg:#5E4A1C; --t-bg2:#463612;
  --t-ink:#FDF7E6; --t-sub:#DFCE9C;
  --t-accent:#F0925E; --t-edge:#B05A28; --t-on-accent:#2B1A00;
}
/* ふゆ — 12-1月 */
[data-theme="winter"]{
  --t-bg:#2A3F6B; --t-bg2:#1C2C4E;
  --t-ink:#F3F7FF; --t-sub:#B4C4E2;
  --t-accent:#9FE0FF; --t-edge:#3E7FA0; --t-on-accent:#2B1A00;
}
/* おしょうがつ — 1月 */
[data-theme="newyear"]{
  --t-bg:#8C1F2A; --t-bg2:#6A141D;
  --t-ink:#FFF4F0; --t-sub:#E8B4B0;
  --t-accent:#F2D06B; --t-edge:#B0912E; --t-on-accent:#2B1A00;
}
/* よる — 特別・ボス部屋 */
[data-theme="night"]{
  --t-bg:#1B1030; --t-bg2:#120A22;
  --t-ink:#EFE8FA; --t-sub:#9C8FBC;
  --t-accent:#FFD836; --t-edge:#C79A00; --t-on-accent:#2B1A00;
}
/* うみ — 夏の海・旅行 */
[data-theme="ocean"]{
  --t-bg:#0A5E6B; --t-bg2:#07454F;
  --t-ink:#EFFCFD; --t-sub:#A2D6DC;
  --t-accent:#FFCF5C; --t-edge:#C29524; --t-on-accent:#2B1A00;
}
/* キャンディ — 軽い企画・若年層 */
[data-theme="candy"]{
  --t-bg:#63348A; --t-bg2:#472565;
  --t-ink:#FBF2FF; --t-sub:#D8BFEA;
  --t-accent:#FF9CC2; --t-edge:#C25E85; --t-on-accent:#2B1A00;
}
/* モノトーン — 真面目な調査 */
[data-theme="mono"]{
  --t-bg:#2E3330; --t-bg2:#1E2220;
  --t-ink:#F5F7F6; --t-sub:#B4BEB9;
  --t-accent:#E8E2D2; --t-edge:#A79E88; --t-on-accent:#2B1A00;
}
/* おうえん — キャンペーン全般 */
[data-theme="cheer"]{
  --t-bg:#9E3225; --t-bg2:#7A241A;
  --t-ink:#FFF3F0; --t-sub:#F2C8C1;
  --t-accent:#FFD836; --t-edge:#C79A00; --t-on-accent:#2B1A00;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:clip}
body{
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;
  background:#F4F6F8;color:#2C3A36;font-weight:700;
}
.wrap{max-width:1120px;margin:0 auto;padding:22px 16px 60px}
h2{font-size:20px;font-weight:900;margin-bottom:4px}
.sub{font-size:13px;color:#6B7A75;margin-bottom:16px;line-height:1.8;max-width:72ch}
.sub code{background:#E7ECEA;padding:1px 5px;border-radius:3px;font-size:12px}
.note{background:#EAF6F0;border:1px solid #B8DDCB;border-radius:6px;
  padding:11px 13px;font-size:12.5px;line-height:1.85;margin:0 0 18px;color:#1E5744;max-width:76ch}
.note b{color:#10422F}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}

.pick{display:block;cursor:pointer;position:relative}
.pick input{position:absolute;opacity:0;width:0;height:0}
.mini{
  display:block;border-radius:12px;overflow:hidden;
  border:3px solid transparent;background:var(--t-bg);
  transition:transform .12s cubic-bezier(.16,1,.3,1);
}
.pick:hover .mini{transform:translateY(-2px)}
.pick input:focus-visible + .mini{outline:3px solid #0E6B5A;outline-offset:2px}
.pick.is-picked .mini{border-color:#0E6B5A}

.mini-hero{display:block;padding:11px 11px 0}
.mini-k{display:inline-block;font-size:8px;font-weight:900;letter-spacing:.1em;
  color:var(--t-ink);background:rgba(255,255,255,.18);padding:2px 7px;border-radius:99px}
.mini-h{display:block;margin-top:5px;font-size:15px;font-weight:900;color:var(--t-ink);line-height:1.35}
.mini-hero svg{display:block;width:100%;height:auto;margin-top:7px}
.mini-slab{display:block;background:#fff;border-radius:10px;margin:-16px 9px 0;
  position:relative;z-index:2;padding:9px 10px;border:2px solid var(--t-bg2)}
.mini-now{display:block;font-size:10px;color:#41514C;font-weight:900}
.mini-now b{font-size:16px;color:var(--t-bg)}
.mini-now i{font-style:normal;color:#7A8985;font-weight:700;margin-left:3px}
.mini-btn{display:block;margin-top:7px;text-align:center;font-size:11.5px;font-weight:900;
  background:var(--t-accent);color:var(--t-on-accent);
  border:2px solid var(--t-edge);border-radius:99px;padding:6px 8px;
  box-shadow:0 2px 0 0 var(--t-edge)}
.mini-map{display:flex;align-items:center;gap:5px;padding:13px 12px 14px}
.mini-map .dot{width:20px;height:20px;border-radius:99px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:9.5px;font-weight:900;color:var(--t-sub);
  background:var(--t-bg2);border:2px solid var(--t-sub)}
.mini-map .dot.on{background:var(--t-accent);color:var(--t-on-accent);border-color:var(--t-edge)}
.mini-map .line{flex:1;height:3px;border-radius:2px;background:var(--t-bg2)}

.meta{display:block;margin-top:8px;font-size:12.5px;line-height:1.5}
.meta b{display:block;font-weight:900}
.meta i{display:block;font-style:normal;font-size:11px;color:#7A8985;font-weight:700;margin-top:1px}
.meta .alt{color:#96A29E;font-size:10.5px;margin-top:3px}
.picked{display:inline-block;margin-top:4px;font-size:10px;font-weight:900;
  background:#0E6B5A;color:#fff;padding:2px 8px;border-radius:99px}
</style>

<div class="wrap">
<h2>ミッションのテーマ — 15種から選ぶ</h2>
<p class="sub">
  管理画面でミッションを作るとき、<b>この一覧から見た目を選ぶ</b>。
  カードは実際のページ（ヒーロー・CTA・すごろく）を縮めたもの。
</p>
<div class="note">
  <b>テーマ＝色＋情景＋文言。</b>色だけ替えても「夏の街を紫にしただけ」にしかならないので、
  <b>描くものそのものを変えている</b>——
  夏祭りは<b>提灯・屋台・打ち上げ花火</b>、正月は<b>門松・初日の出</b>、
  梅雨は<b>傘と雨</b>、みのりは<b>稲穂</b>。見出しの言葉もテーマごとに変わる。<br>
  実装は <code>theme_key</code> 1列のまま。シーンSVGはテーマの一部としてデータで持つので、
  <b>ページ実装は1枚</b>で変わらない。全15種コントラスト実測済み。
</div>
